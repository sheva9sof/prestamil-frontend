<div class="row">
  <div class="col-12">
    <!-- Notificación flotante de éxito -->
    <div *ngIf="successMessage" class="notification-toast notification-success">
      <div class="notification-content">
        <i class="feather icon-check-circle"></i>
        <span>{{ successMessage }}</span>
        <button type="button" class="notification-close" (click)="successMessage = ''">
          <i class="feather icon-x"></i>
        </button>
      </div>
    </div>

    <!-- Modal de carga -->
    <ng-template #loadingModal let-modal>
      <div class="modal-header" style="border-bottom: none;">
        <h5 class="modal-title">Guardando parámetro</h5>
      </div>
      <div class="modal-body text-center py-4">
        <i class="feather icon-loader spin-icon" style="font-size: 48px; color: #5e72e4;"></i>
        <p class="mt-3 mb-0" style="font-size: 16px; color: #2c3e50;">Guardando cambios...</p>
      </div>
    </ng-template>

    <div>
      <!-- Indicador de carga -->
      <div *ngIf="isLoadingData" class="text-center py-5">
        <i class="feather icon-loader spin-icon" style="font-size: 32px; color: #5e72e4;"></i>
        <p class="mt-3">Cargando parámetros del sistema...</p>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage && !isLoadingData" class="alert alert-danger mb-3" role="alert">
        {{ errorMessage }}
      </div>

      <!-- Tabla de parámetros -->
      <div *ngIf="!isLoadingData" class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
          <thead>
            <tr>
              <th style="width: 25%;">Descripción</th>
              <th style="width: 65%;">Valor</th>
              <th style="width: 10%;">Edición</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let parametro of parametros; trackBy: trackByFn">
              <td>{{ parametro.descripcion }}</td>
              <td>
                <!-- Modo edición -->
                <div *ngIf="isEditing(parametro.id)">
                  <!-- Textarea -->
                  <textarea 
                    *ngIf="parametro.tipoDatoInterfaz === 'textarea'"
                    class="form-control"
                    [(ngModel)]="editedValues[parametro.id]"
                    rows="3"
                    style="min-width: 100%;"
                  ></textarea>
                  
                  <!-- Checkbox para bool -->
                  <div *ngIf="parametro.tipoDatoInterfaz === 'bool'" class="form-check form-switch">
                    <input 
                      class="form-check-input" 
                      type="checkbox" 
                      id="param-{{parametro.id}}"
                      [(ngModel)]="editedValues[parametro.id]"
                    />
                    <label class="form-check-label" for="param-{{parametro.id}}">
                      {{ editedValues[parametro.id] ? 'Sí' : 'No' }}
                    </label>
                  </div>
                  
                  <!-- Input number -->
                  <input 
                    *ngIf="parametro.tipoDatoInterfaz === 'number'"
                    type="number" 
                    class="form-control"
                    [(ngModel)]="editedValues[parametro.id]"
                    step="0.01"
                  />
                </div>
                
                <!-- Modo visualización -->
                <div *ngIf="!isEditing(parametro.id)">
                  <span *ngIf="parametro.tipoDatoInterfaz === 'textarea'" class="text-muted">
                    {{ getDisplayValue(parametro) || '(vacío)' }}
                  </span>
                  <span *ngIf="parametro.tipoDatoInterfaz === 'bool'">
                    <span class="badge" [ngClass]="parametro.valorNumerico === 1 ? 'badge-success' : 'badge-secondary'">
                      {{ getDisplayValue(parametro) }}
                    </span>
                  </span>
                  <span *ngIf="parametro.tipoDatoInterfaz === 'number'">
                    {{ getDisplayValue(parametro) }}
                  </span>
                </div>
              </td>
              <td>
                <!-- Botones de acción -->
                <div *ngIf="!isEditing(parametro.id)" class="action-buttons">
                  <button 
                    type="button" 
                    class="btn-edit"
                    (click)="startEdit(parametro.id)"
                    title="Editar">
                    <i class="feather icon-edit-2"></i>
                    <span>Editar</span>
                  </button>
                </div>
                
                <div *ngIf="isEditing(parametro.id)" class="action-buttons">
                  <button 
                    type="button" 
                    class="btn-save"
                    (click)="saveParametro(parametro)"
                    [disabled]="isLoading"
                    title="Guardar">
                    <i class="feather icon-check" *ngIf="!isLoading"></i>
                    <i class="feather icon-loader spin-icon" *ngIf="isLoading"></i>
                    <span *ngIf="!isLoading">Guardar</span>
                    <span *ngIf="isLoading">Guardando...</span>
                  </button>
                  <button 
                    type="button" 
                    class="btn-cancel"
                    (click)="cancelEdit(parametro.id)"
                    [disabled]="isLoading"
                    title="Cancelar">
                    <i class="feather icon-x"></i>
                    <span>Cancelar</span>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
