<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card login-card">
      <div class="card-body">
        <div class="login-header text-center mb-4">
          <img src="assets/images/prestamil.png" alt="Prestamil Logo" class="login-logo" />
          <h2 class="login-title mt-3">Bienvenido</h2>
          <p class="login-subtitle">Inicia sesión para continuar</p>
        </div>
        
        <form [formGroup]="loginForm" class="login-form" (ngSubmit)="login()">
          <div class="form-group mb-3">
            <label for="username" class="form-label">Usuario</label>
            <div class="input-wrapper">
              <i class="feather icon-mail input-icon"></i>
              <input 
                type="text" 
                id="username"
                formControlName="username"
                class="form-control" 
                [class.is-invalid]="username?.invalid && username?.touched"
                placeholder="Ingresa tu usuario" 
              />
            </div>
            <div *ngIf="username?.invalid && username?.touched" class="invalid-feedback d-block">
              <span *ngIf="username?.errors?.['required']">El usuario es requerido</span>
              <span *ngIf="username?.errors?.['minlength']">El usuario debe tener al menos 5 caracteres</span>
            </div>
          </div>
          
          <div class="form-group mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-wrapper">
              <i class="feather icon-lock input-icon"></i>
              <input 
                type="password" 
                id="password"
                formControlName="password"
                class="form-control" 
                [class.is-invalid]="password?.invalid && password?.touched"
                placeholder="Ingresa tu contraseña" 
              />
            </div>
            <div *ngIf="password?.invalid && password?.touched" class="invalid-feedback d-block">
              <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
              <span *ngIf="password?.errors?.['minlength']">La contraseña debe tener al menos 5 caracteres</span>
            </div>
          </div>
          
          <!-- Mensaje de error -->
          <div *ngIf="errorMessage" class="alert alert-danger mb-3" role="alert">
            {{ errorMessage }}
          </div>
          
          <button 
            type="submit" 
            class="btn btn-primary btn-login w-100 mb-3" 
            [disabled]="loginForm.invalid || isLoading">
            <span *ngIf="!isLoading">Iniciar sesión</span>
            <span *ngIf="isLoading">
              <i class="feather icon-loader spin-icon"></i> Iniciando sesión...
            </span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
