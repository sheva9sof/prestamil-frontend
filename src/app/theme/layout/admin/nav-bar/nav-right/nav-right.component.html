<ng-template #logoutModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Cerrar Sesión</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <p class="mb-0">¿Está seguro de que desea cerrar sesión?</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
    <button type="button" class="btn btn-danger" (click)="modal.close('confirm')">
      <i class="feather icon-log-out me-1"></i>Salir
    </button>
  </div>
</ng-template>

<span>Bienvenido, {{ fullName }}</span>
<ul class="navbar-nav">
  <li>
    <div class="dropdown" ngbDropdown placement="auto">
    </div>
  </li>
  <li>
    <div class="dropdown drp-user" ngbDropdown placement="auto">
      <a href="javascript:" ngbDropdownToggle data-toggle="dropdown">
        <i class="icon feather icon-user"></i>
      </a>
      <div class="dropdown-menu dropdown-menu-end profile-notification" ngbDropdownMenu>
        <ul class="pro-body">
          <li>
            <button type="button" class="dropdown-item" (click)="goToUpdatePassword()">
              <i class="feather icon-lock"></i>
              Actualizar Contraseña
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item" (click)="goToUpdatePassword()">
              <i class="feather icon-user"></i>
              Perfil
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item" (click)="logout()">
              <i class="feather icon-log-out"></i>
              Salir
            </button>
          </li>
        </ul>
      </div>
    </div>
  </li>
</ul>
